name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install
      
    - name: Validate Prisma schema
      run: pnpm dlx prisma validate

    # `prisma generate` writes into node_modules only, so a fresh checkout has no
    # client and `@prisma/client` resolves to src/types/prisma-override.d.ts,
    # where the query methods are `any`. Generating first is what makes
    # `withTenant(id, (tx) => tx.planAssignment.findMany(…))` infer a row type
    # instead of `unknown`. It needs no database and no DATABASE_URL.
    - name: Generate Prisma client
      run: pnpm db:generate

    - name: Lint
      run: pnpm lint
      
    - name: Typecheck
      run: pnpm typecheck
      
    - name: Test
      run: pnpm test
