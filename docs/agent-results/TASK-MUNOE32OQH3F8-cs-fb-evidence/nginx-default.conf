# docs/SMTP-SUNUCU.md §10.1 location block verbatim (TLS dropped for the local run; upstream = host next dev :3961)
server { listen 80; listen [::]:80;
         location = /__echo { default_type text/plain; return 200 "xff_sent_upstream=$proxy_add_x_forwarded_for remote_addr=$remote_addr\n"; }
         location / { proxy_pass http://host.docker.internal:3961; proxy_set_header Host $host;
                      proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; } }
