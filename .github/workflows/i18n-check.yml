name: i18n Check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'messages/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  i18n-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run i18n audit
        id: audit
        run: pnpm i18n:check
        continue-on-error: true

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Run the audit and capture JSON output
            const { execSync } = require('child_process');
            try {
              const output = execSync('pnpm i18n:check 2>&1', { encoding: 'utf8' });
              // Extract JSON from output
              const jsonStart = output.indexOf('{');
              const jsonEnd = output.lastIndexOf('}') + 1;
              const report = JSON.parse(output.substring(jsonStart, jsonEnd));

              const { summary } = report;
              let comment = '## 🌍 i18n Translation Audit\n\n';

              if (summary.missingInBoth.length > 0) {
                comment += `### ❌ Missing in BOTH languages (${summary.missingInBoth.length})\n`;
                comment += summary.missingInBoth.slice(0, 20).map(k => `- ${k}`).join('\n');
                if (summary.missingInBoth.length > 20) {
                  comment += `\n- ... and ${summary.missingInBoth.length - 20} more\n`;
                }
                comment += '\n';
              }

              if (summary.missingInTurkish.length > 0) {
                comment += `### ⚠️ Missing in Turkish (${summary.missingInTurkish.length})\n`;
                comment += summary.missingInTurkish.slice(0, 20).map(k => `- ${k}`).join('\n');
                if (summary.missingInTurkish.length > 20) {
                  comment += `\n- ... and ${summary.missingInTurkish.length - 20} more\n`;
                }
                comment += '\n';
              }

              if (summary.missingInEnglish.length > 0) {
                comment += `### ⚠️ Missing in English (${summary.missingInEnglish.length})\n`;
                comment += summary.missingInEnglish.slice(0, 20).map(k => `- ${k}`).join('\n');
                if (summary.missingInEnglish.length > 20) {
                  comment += `\n- ... and ${summary.missingInEnglish.length - 20} more\n`;
                }
                comment += '\n';
              }

              if (summary.missingInBoth.length === 0 &&
                  summary.missingInTurkish.length === 0 &&
                  summary.missingInEnglish.length === 0) {
                comment += '✅ All translation keys are present in both languages!\n\n';
              }

              comment += `\n**Stats:** ${summary.totalKeysInCode} used | ${summary.totalKeysInTurkish} TR | ${summary.totalKeysInEnglish} EN`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.error('Failed to parse audit output', error);
            }

      - name: Fail if gaps found
        if: steps.audit.outcome == 'failure'
        run: exit 1
