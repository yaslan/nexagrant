allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  # esbuild (via tsx and vite/vitest): its postinstall checks that the platform
  # binary from @esbuild/<os>-<arch> matches and repairs it if that optional
  # package was skipped. tsx (scripts, db:rls, db:seed) and vitest need it.
  # Unlisted, pnpm 11 fails `pnpm install` in CI with ERR_PNPM_IGNORED_BUILDS.
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false

overrides:
  # TASK-MUN80RJ96EG0O (O-3): image-size <=2.0.2 loops forever on crafted
  # HEIF/ICNS/JXL bytes (GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr). NOTE:
  # html-to-docx 1.8.0 BUNDLES its own copy in dist/ and never requires this
  # package, so the override only clears the installed (unused) copy from the
  # audit. The bundled parser is kept out of reach by src/lib/docx-safe-html.ts,
  # which lets only PNG/JPEG/GIF signatures through to html-to-docx.
  'html-to-docx>image-size': '>=2.0.3'

  # TASK-MVBCEWUNZ9HXV (FO-8): transitive advisories from the prod audit that
  # next 16.3.8 does not clear. Each pins only the vulnerable line to the first
  # patched release. Selector form, same-major only: '<pkg>@>=X.0.0 <X.Y.Z'
  # (0.x: '>=0.Y.0', since a 0.x minor is breaking). A different major is left
  # alone on purpose, so a dependency that later pulls an older major is not
  # silently moved across a breaking release (TASK-MVBIVTBC7F317, FO-18).
  # Paths: sharp via next (optional dep ^0.35.4); undici via shadcn / openai;
  # hono, @hono/node-server, @modelcontextprotocol/sdk, proxy-addr via shadcn's
  # MCP SDK + express; mysql2, deepmerge-ts, fast-uri via prisma.
  'sharp@>=0.35.0 <0.35.5': '0.35.5'
  'undici@>=7.0.0 <7.29.1': '7.29.1'
  'undici@>=8.0.0 <8.10.2': '8.10.2'
  'hono@>=4.0.0 <4.13.7': '4.13.7'
  '@hono/node-server@>=1.0.0 <1.19.15': '1.19.15'
  '@modelcontextprotocol/sdk@>=1.0.0 <1.31.0': '1.31.0'
  'proxy-addr@>=2.0.0 <2.0.8': '2.0.8'
  'mysql2@>=3.0.0 <3.23.1': '3.23.1'
  # Deliberate major jump (GHSA-ggr8-5vv4-36mx): @prisma/config 7.1.5 pins
  # deepmerge-ts 7.x exactly and no patched 7.x exists. The one override that
  # crosses a major; first line to revisit on a Prisma upgrade.
  'deepmerge-ts@<8.0.0': '8.0.0'
  'fast-uri@>=3.0.0 <3.1.8': '3.1.8'
  'ip-address@>=10.0.0 <10.7.1': '10.7.1'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'postcss-selector-parser@>=7.0.0 <7.1.6': '7.1.6'
  # brace-expansion 5.0.x under shadcn > ts-morph > minimatch; same major (5.x),
  # so only the patch line moves. Range selector keeps minimatch@3's 1.x copy
  # (and, since FO-18, any 4.x copy: '>=4.0.0' would have lifted it to 5.x).
  'brace-expansion@>=5.0.0 <5.0.12': '5.0.12'
