# Local development stack. See README "Yerel çalıştırma".
#
# The project name is pinned to `fabrika` because the existing data volume
# `fabrika_pgdata` carries the labels of compose project "fabrika", volume
# "pgdata"; any other project name makes compose refuse or duplicate it.
name: fabrika

services:
  # Next.js 16 web application (production image). Behind the `app` profile so
  # `docker compose up -d` does not take host port 3000, which the shared
  # `pnpm dev` server already uses. Start with `--profile app`.
  # AUTH_SECRET stays required (`:?`) even though the service sits behind a
  # profile: compose interpolates the whole file before it applies profiles, so
  # an empty AUTH_SECRET fails every command, `up -d` for the database included.
  # That is deliberate: the alternative (`:-`) would start a container that
  # crash-loops on the app's own check (src/lib/auth-secret.ts). README step 2
  # fills it.
  fabrika-web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: fabrika-web
    restart: unless-stopped
    ports:
      - "${FABRIKA_WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://fabrika:${FABRIKA_PG_PASSWORD:-fabrika}@postgres-vector:5432/fabrika?schema=public
      - REDIS_URL=redis://redis:6379
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 32)}
      - NEXTAUTH_URL=http://localhost:${FABRIKA_WEB_PORT:-3000}
    depends_on:
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scheduled-job worker (graphile-worker, ADR-0008). Same profile and database
  # as the web app. Several workers on one database are safe (each cron tick
  # runs once), but this service is one container: `container_name` is fixed,
  # so `--scale` does not work; start a second copy under another name.
  # This stack has no other scheduler, so cron defaults to on here. That
  # default is for the local stack only: a production deployment must set
  # JOBS_CRON_ENABLED explicitly and follow ADR-0008 §9.2 (İNCELEME-38 Ö-4).
  fabrika-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: fabrika-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://fabrika:${FABRIKA_PG_PASSWORD:-fabrika}@postgres-vector:5432/fabrika?schema=public
      - JOBS_CRON_ENABLED=${JOBS_CRON_ENABLED:-true}
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 32)}
    depends_on:
      postgres-vector:
        condition: service_healthy

  # PostgreSQL 16 + pgvector. Host port 5433 by default: 5432 on this machine
  # belongs to another project's Postgres. The POSTGRES_* values only matter
  # when the volume is empty; an existing volume keeps its roles and passwords.
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: fabrika-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fabrika
      POSTGRES_PASSWORD: ${FABRIKA_PG_PASSWORD:-fabrika}
      POSTGRES_DB: fabrika
    ports:
      - "${FABRIKA_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrika -d fabrika"]
      interval: 5s
      timeout: 5s
      retries: 5

  # REDIS_URL in .env.example (redis://localhost:6379). Nothing in src/ reads
  # REDIS_URL yet (jobs run on graphile-worker in Postgres); nothing breaks if it is down.
  redis:
    image: redis:7-alpine
    container_name: fabrika-redis
    restart: unless-stopped
    ports:
      - "${FABRIKA_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # SMTP on 1025, web UI on http://localhost:8025. The app sends here when
  # SMTP_HOST=localhost and SMTP_PORT=1025 (src/lib/email/mailer.ts); blank
  # SMTP_HOST = no mail sent at all, not mail caught.
  mailpit:
    image: axllent/mailpit:latest
    container_name: fabrika-mailpit
    restart: unless-stopped
    ports:
      - "${FABRIKA_SMTP_PORT:-1025}:1025"
      - "${FABRIKA_MAILPIT_PORT:-8025}:8025"

volumes:
  # Fixed name so compose reuses the volume the hand-made fabrika-postgres
  # container already writes to, instead of creating an empty one.
  pgdata:
    name: fabrika_pgdata
  redisdata:
    name: fabrika_redisdata
