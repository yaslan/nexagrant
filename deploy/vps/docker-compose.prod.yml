# Canlı yığın — Hostinger KVM 4 (191.96.1.252, Ubuntu 24.04, 4 vCPU / 16 GB / 200 GB, CloudPanel).
# Kart: NG-261 (TASK-MWNJMJSSN63YW). Adım adım kurulum ve geri alma: deploy/vps/RUNBOOK.md.
#
# Bu makinede 80/443 CloudPanel'in nginx'indedir ve başka siteler de yayındadır. Bu dosyanın
# Caddy'si varsayılan olarak KALKMAZ (profile "caddy"): yalnız CloudPanel'siz bir makinede kullanılır.
# NexaGrant, CloudPanel'de bir Reverse Proxy sitesi olarak `127.0.0.1:${WEB_HOST_PORT:-3000}`
# adresindeki `web` konteynerine bağlanır (RUNBOOK §5, CloudPanel bölümü).
#
# Veritabanı: DB-1 kararı gereği Supabase (EU). Bu yığında postgres varsayılan olarak kalkmaz
# (profile "db"); web ve worker DATABASE_URL / JOBS_DATABASE_URL ile Supabase'e bağlanır.
#
# Dışarıya açık port YOK: web yalnız 127.0.0.1'e yayınlanır; clamav ve worker yalnız compose iç ağında.
# Redis yok: REDIS_URL hiçbir yerde okunmuyor (FO-243).
# Python CORDIS servisi bu dosyada YOK (RUNBOOK §10).
#
# Sırlar bu dosyada YOK. Dosyalar (git'e girmez, izin 600):
#   deploy/vps/.env.prod  → uygulama sırları. web ve worker alır.
#   deploy/vps/.env.db    → yalnız profile "db" açıkken postgres ve ops.sh için.
#
# Kullanım (depo kökünden). Revision etiketi zorunlu (FO-308 R-1), yoksa ops.sh imajı reddeder:
#   GIT_REVISION=$(git rev-parse HEAD) docker compose -f deploy/vps/docker-compose.prod.yml build web worker
#   docker compose -f deploy/vps/docker-compose.prod.yml up -d --no-build clamav web
#   # clamd healthy olduktan sonra (RUNBOOK §5 sırası):
#   docker compose -f deploy/vps/docker-compose.prod.yml up -d --no-build worker
name: fonbridge

services:
  # Dosya tarayıcısı (NG-239). İmza veritabanı ilk açılışta indirilir; sağlık kontrolü bitene kadar
  # sağlıksız. AlertExceedsMax zorunlu: yoksa sınırı aşan arşive clamd OK der (NG-239 Ö-1).
  clamav:
    image: clamav/clamav:stable
    container_name: fonbridge-clamav
    restart: unless-stopped
    environment:
      CLAMD_CONF_AlertExceedsMax: "yes"
    # Port yayını YOK: INSTREAM kimlik doğrulamasız ve şifresiz; yalnız web/worker erişir (CLAMD_HOST=clamav).
    volumes:
      - clamavdb:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    mem_limit: 3g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    container_name: fonbridge-caddy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
      args:
        # FO-308 R-1: ops.sh bu değeri HEAD ile karşılaştırır. Derlerken GIT_REVISION=$(git rev-parse HEAD) verin.
        GIT_REVISION: ${GIT_REVISION:-unknown}
    image: fonbridge-web:local
    container_name: fonbridge-web
    restart: unless-stopped
    env_file: ./.env.prod
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=1024
    # Yalnız loopback. CloudPanel nginx'i (ya da yerel prova nginx'i) buraya vekillik eder. 0.0.0.0 YOK.
    # WEB_HOST_PORT compose İNTERPOLASYONU ile okunur: env_file (.env.prod) buradan OKUNMAZ (NG-261 O-1).
    # Değeri deploy/vps/.env içine yaz (compose bu dosyayı otomatik okur; git'e girmez). RUNBOOK §2.
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    # GET /api/health: süreç ayakta ve istek karşılıyor (src/app/api/health/route.ts). Veritabanına bakmaz.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker
      args:
        # FO-308 R-1: ops.sh bu değeri HEAD ile karşılaştırır. Derlerken GIT_REVISION=$(git rev-parse HEAD) verin.
        GIT_REVISION: ${GIT_REVISION:-unknown}
    image: fonbridge-worker:local
    container_name: fonbridge-worker
    restart: unless-stopped
    # JOBS_CRON_ENABLED .env.prod'da açıkça true/false olmalı; boşsa üretim worker'ı başlamaz (src/lib/env.ts).
    env_file: ./.env.prod
    environment:
      - NODE_ENV=production
    # Yayın sırası (NG-239 Ö-4): önce clamd healthy, sonra worker (migrasyon ve süpürme worker'dan sonra).
    depends_on:
      clamav:
        condition: service_healthy
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Yerel prova ya da DB-1 öncesi geçici veritabanı için. Canlıda (Supabase) profile "db" açılmaz.
  postgres:
    profiles: ["db"]
    image: pgvector/pgvector:pg16
    container_name: fonbridge-postgres
    restart: unless-stopped
    env_file: ./.env.db
    environment:
      POSTGRES_USER: fabrika
      POSTGRES_DB: fabrika
    # Yalnız loopback: dış ağdan erişilmez.
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrika -d fabrika"]
      interval: 5s
      timeout: 5s
      retries: 10
    # shared_buffers ~ RAM'in %25'i; 2g sınırı içinde.
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=100"]
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
    name: fonbridge_pgdata
  clamavdb:
    name: fonbridge_clamavdb
  caddy_data:
    name: fonbridge_caddy_data
  caddy_config:
    name: fonbridge_caddy_config
