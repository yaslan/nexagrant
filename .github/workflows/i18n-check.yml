name: i18n Check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'messages/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  i18n-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # continue-on-error so the PR still gets the comment below explaining WHAT is
      # missing; the final step re-raises the failure.
      - name: Run i18n audit
        id: audit
        run: pnpm i18n:check --json > i18n-report.json
        continue-on-error: true

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // The report is read from disk, not from a second `execSync('pnpm i18n:check')`.
            // That call threw the moment the audit exited non-zero — i.e. in exactly the
            // situation this step exists for — so the catch swallowed it and no comment was
            // ever posted on a failing PR.
            let report;
            try {
              report = JSON.parse(fs.readFileSync('i18n-report.json', 'utf8'));
            } catch (error) {
              core.warning(`Could not read i18n-report.json: ${error.message}`);
              return;
            }

            const { summary } = report;
            const section = (heading, keys) => {
              if (!keys || keys.length === 0) return '';
              let out = `### ${heading} (${keys.length})\n`;
              out += keys.slice(0, 20).map(k => `- \`${k}\``).join('\n');
              if (keys.length > 20) out += `\n- ... and ${keys.length - 20} more`;
              return out + '\n\n';
            };

            let comment = '## 🌍 i18n Translation Audit\n\n';
            comment += section('❌ In `tr.json` but not in `en.json`', summary.onlyInTurkish);
            comment += section('❌ In `en.json` but not in `tr.json`', summary.onlyInEnglish);
            comment += section('❌ Used in code, missing in BOTH languages', summary.missingInBoth);
            comment += section('❌ Used in code, missing in Turkish', summary.missingInTurkish);
            comment += section('❌ Used in code, missing in English', summary.missingInEnglish);
            comment += section('❌ Dynamic key shape matches nothing in Turkish', summary.unmatchedPatternsTurkish);
            comment += section('❌ Dynamic key shape matches nothing in English', summary.unmatchedPatternsEnglish);

            if (comment === '## 🌍 i18n Translation Audit\n\n') {
              comment += '✅ All translation keys are present in both languages!\n\n';
            }

            comment += `\n**Stats:** ${summary.totalKeysInCode} static keys used | `;
            comment += `${summary.totalDynamicPatterns} dynamic patterns | `;
            comment += `${summary.totalKeysInTurkish} TR | ${summary.totalKeysInEnglish} EN`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if gaps found
        if: steps.audit.outcome == 'failure'
        run: exit 1
