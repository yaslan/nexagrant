# §10.1 location block verbatim (TLS dropped). THIS test config listens on [::] ON PURPOSE:
# it simulates "IPv6 opened later" to show the app's /64 bucket. Upstream = host harness :3962.
server { listen 80; listen [::]:80;
         location / { proxy_pass http://host.docker.internal:3962; proxy_set_header Host $host;
                      proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; } }
