<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        circle { fill: #F4F6F8; }
        rect, line { stroke: #F4F6F8; fill: #F4F6F8; }
      }
    </style>
  </defs>

  <!-- Light mode colors (default) -->
  <!-- Two towers -->
  <rect x="50" y="90" width="20" height="110" fill="#1E6B7A"/>
  <rect x="186" y="90" width="20" height="110" fill="#1E6B7A"/>

  <!-- Horizontal beams connecting towers (thicker at top) -->
  <rect x="70" y="110" width="116" height="14" fill="#1E6B7A"/>
  <rect x="70" y="130" width="116" height="8" fill="#1E6B7A"/>
  <rect x="70" y="150" width="116" height="8" fill="#1E6B7A"/>

  <!-- Base supports -->
  <rect x="45" y="200" width="30" height="35" fill="#1E6B7A"/>
  <rect x="181" y="200" width="30" height="35" fill="#1E6B7A"/>

  <!-- Favicon sizes note: Next.js will use this for icon.svg, sizes="any" -->
</svg>
