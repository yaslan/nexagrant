name: CI

on:
  push:
    branches: [ "main", "dev" ]
  # PR bases: main/dev, plus the stacked bases in use (NG-353, measured on the
  # open PRs: task/ng-*, se-fb/*, be-fb/*). A PR whose base is one of these
  # runs the full build-and-test and e2e, not just the path-filtered jobs.
  # `push` stays main/dev only, so a commit to a task branch runs CI once, on
  # its PR, never twice.
  pull_request:
    branches: [ "main", "dev", "task/**", "se-fb/**", "be-fb/**" ]
  # Manual runs, to measure the e2e suite against another server without a commit
  # (TASK-MULXYMNTUELIK). Pushes and PRs always use `dev`.
  workflow_dispatch:
    inputs:
      e2e_server:
        description: 'Server the e2e suite runs against (see playwright.config.ts)'
        type: choice
        options: [ dev, start ]
        default: dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The `e2e_server: start` run took 99 min (TASK-MUSJ4RYVZEZ6Q); GitHub's
    # default is 360. 120 leaves ~20% headroom and stops a hung run 4 h sooner.
    timeout-minutes: 120
    # Job-wide so the DB preparation, the vitest suites that hit Postgres and
    # the e2e run all reach the same service container.
    env:
      DATABASE_URL: postgresql://fabrika:fabrika@localhost:5432/fabrika
      # RLS-subject role (NOSUPERUSER NOBYPASSRLS) for the live RLS suites.
      # `pnpm db:rls-role` creates fabrika_app with this password. A throwaway
      # service-container credential like the one above, not a secret.
      DATABASE_URL_RLS_TEST: postgresql://fabrika_app:fabrika_app_ci@localhost:5432/fabrika
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: fabrika
          POSTGRES_USER: fabrika
          POSTGRES_PASSWORD: fabrika
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # Mail catcher for the e2e step (TASK-MUVFUDZDKSMWO). The invite cooldown
      # answers (`recently_sent`, `role_change_blocked`) only exist once a mail
      # has really been sent; with no SMTP the server stops at "created, mail
      # not sent" and tests/e2e/team-members-ui.spec.ts cannot reach them.
      # Accepts anything on :1025, nothing leaves the runner; :8025 is its API.
      # axllent/mailpit v1.31.3, pinned by digest like MinIO below.
      mailpit:
        image: axllent/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        ports:
          - 1025:1025
          - 8025:8025
    steps:
    - uses: actions/checkout@v4

    # Real clamd for the NG-239 scan suites (tests/evidence-scan.live.test.ts):
    # without it their six real-clamd tests skip and the live-skip gate in the
    # Test step fails the job. Started first, because the first start downloads
    # the signatures (freshclam) before clamd listens; "Wait for clamd" below
    # waits for it right before the Test step. The image and option match
    # docker-compose.yml's `clamav` service (ClamAV 1.5.4, the version the
    # tests were measured on); AlertExceedsMax=yes is what makes the over-limit
    # test answer `Heuristics.Limits.Exceeded` instead of OK (NG-239 Ö-1).
    # Loopback only, like compose: INSTREAM has no authentication.
    # clamav/clamav-debian:1.5.4, pinned by its index digest.
    - name: Start clamd (test virus scanner)
      run: |
        docker run -d --name clamd -p 127.0.0.1:3310:3310 \
          -e CLAMD_CONF_AlertExceedsMax=yes \
          clamav/clamav-debian@sha256:6982509b9e1415bf23cb49d0c55872fdd57fd2b92be33fa26d487da42d322076

    # No `version:` here: action-setup reads `packageManager` from package.json,
    # so CI runs the same pnpm as a developer. A pinned `version: 9` could not
    # parse pnpm-workspace.yaml (no `packages:` field) and failed the cache step.
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    # pnpm 11 requires Node >= 22.13; on Node 20 it cannot start.
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install

    # `pnpm exec`, not `pnpm dlx`: dlx downloads the newest prisma from the
    # registry instead of the pinned one, and prisma 8+ has no `validate`.
    - name: Validate Prisma schema
      run: pnpm exec prisma validate

    # `prisma generate` writes into node_modules only, so a fresh checkout has no
    # client and `@prisma/client` resolves to src/types/prisma-override.d.ts,
    # where the query methods are `any`. Generating first is what makes
    # `withTenant(id, (tx) => tx.planAssignment.findMany(…))` infer a row type
    # instead of `unknown`. It needs no database and no DATABASE_URL.
    - name: Generate Prisma client
      run: pnpm db:generate

    # `pnpm db:setup` (scripts/db-setup.sh, TASK-MVBFDSUSE5QCY) is the one
    # command that builds a database from empty, here and on a laptop or
    # worktree; the order below lives in that script. Twice: the second run is
    # the idempotency check of the whole chain; either run failing fails the job.
    #
    # The order: `db push` builds the schema from schema.prisma without the
    # interactive `migrate dev`, `db:rls` installs the tenant policies and the
    # system-scope functions, and the seed adds the demo tenant and the module
    # catalogue that the database-backed tests read.
    #
    # `db:rls-role` sits between them on purpose. It needs the tables from
    # `db push` for its grants, and `db:rls` grants EXECUTE on
    # enter_system_scope() to fabrika_app only if the role already exists.
    # Created after `db:rls`, the role gets "permission denied for function
    # enter_system_scope" and the live RLS suites fail. Without the role at all
    # they fail with "refusing to skip in CI" (tests/helpers/live-db-role.ts).
    #
    # scripts/apply-migrations.sh then applies prisma/migrations in the order
    # listed in apply-order.txt (TASK-MULU7SAA4EPP8). `db push` builds only what
    # schema.prisma describes; SECURITY DEFINER functions (redeem_agency_invite),
    # CHECK constraints and the per-file policies live only in the migrations,
    # and without them tests/agency-invite.live.test.ts had nothing to measure.
    # It runs after `db push`, not instead of it: the migrations never create
    # the base tables (Tenant, User, …). After `db:rls-role`, so their
    # `GRANT … TO fabrika_app` guards find the role. Re-running is how
    # production applies them (docs/RELEASE_CHECKLIST.md §3.1), so the second
    # db:setup also re-applies every migration file.
    # psql comes preinstalled on ubuntu-latest.
    #
    # Supabase's `ensure_rls` event trigger goes in first (TASK-MUWDA86A7U4LK).
    # Live ENABLEs RLS on every new table in public; on a policy-less
    # SYSTEM_WIDE table that is deny-all for fabrika_app, and BlogPost broke on
    # live while every CI suite stayed green (TASK-MUTP1R1C13GE3). With it, every
    # table `db push` builds starts locked, as on a fresh Supabase project. So
    # `db:rls` also runs BEFORE the migrations: its DISABLE loop unlocks the
    # policy-less base tables (Tenant, User, …) that no migration creates, and
    # the apply-migrations postflight fails on any table without a tenantId
    # left RLS on with no policy. It is also the live order of things: there
    # the policies exist when the migrations run. The trailing `db:rls` stays,
    # for what the migrations change.
    - name: Prepare database
      run: |
        psql --version
        pnpm db:setup
        pnpm db:setup

    # Catalog-level policy drift (TASK-MUPCYOCLINGC7, crw2-fb Y-1). A system_scope
    # policy turned back into the bare, forgeable `app.system_scope = 'on'` test
    # in the database (mutants N4/N5) kept every vitest suite green; only this
    # live check, which reads pg_policies and measures isolation as fabrika_app,
    # went red. It used to run only in the local `pnpm gate`.
    # `--require-db`: this job always has its database. An unreachable one must
    # fail here, not pass as a skipped measurement (scripts/check-rls-live.ts, R-S7).
    - name: Verify RLS policies (live, as fabrika_app)
      run: pnpm rls:verify --require-db

    # Static half of the tenant-isolation pair (scripts/check-tenant-bypass.ts):
    # a tenant-scoped Prisma call outside withTenant fails here. It reads files
    # only, so it needs no database, but it sits next to the live check it pairs with.
    - name: Tenant bypass gate
      run: pnpm rls:bypass-check

    # Open SystemAlert rows that name deleted tenants (scripts/check-orphan-alerts.ts).
    # Runs against the service container prepared above.
    - name: Orphan alert gate
      run: pnpm alerts:check

    - name: Lint
      run: pnpm lint
      
    - name: Typecheck
      run: pnpm typecheck
      
    # Waits for the clamd started after checkout (see "Start clamd"). Red, not
    # skipped, if it never answers: the Test step would otherwise skip its tests.
    - name: Wait for clamd
      run: |
        for i in $(seq 1 120); do
          [ "$(docker inspect -f '{{.State.Running}}' clamd)" = true ] || { docker logs clamd; echo "clamd exited"; exit 1; }
          if [ "$(printf 'zPING\0' | nc -w 5 127.0.0.1 3310 | tr -d '\0')" = PONG ]; then
            echo "clamd up after ~$((i * 5))s: $(printf 'zVERSION\0' | nc -w 5 127.0.0.1 3310 | tr -d '\0')"
            exit 0
          fi
          sleep 5
        done
        docker logs clamd
        echo "clamd did not answer PING within 10 min"
        exit 1

    # AUTH_SECRET: the live suites that drive the real Auth.js callback
    # (oauth-registration, invitation-accept) sign and verify cookies with it.
    # Without it they skipped themselves and the step went green having run
    # none of their 38 tests (İNCELEME-54 Y-1); they now fail instead
    # (requireTestEnv in tests/helpers/live-db-role.ts). A fixed test-only
    # value like the database passwords above, not a secret, and not the key
    # of any deployment. The e2e step sets its own (playwright.config.ts).
    #
    # Live-skip gate (İNCELEME-62 O-1): the JSON report is read after the run
    # and any skipped `*.live.test.ts` test fails the step, however the skip
    # came about (scripts/live-skip-gate.ts). `vitest run` directly, not
    # `pnpm test --reporter=…`: pnpm would take `--reporter` as its own flag.
    # Pinned by tests/live-skip-gate.test.ts.
    #
    # NG-239: the first run has clamd up (NG239_CLAMD_HOST), so the real-clamd
    # tests run; "with the configured clamd stopped" needs that same clamd
    # down and is skipped there. So clamd is stopped and that one test runs
    # on its own. Its verdict replaces the skipped entry of the same file and
    # name in vitest-report.json, nothing else: a test skipped in both runs
    # stays skipped and the gate still fails on it. The first run's report is
    # kept as vitest-report.main.json. A failure in either run fails the step.
    - name: Test
      run: |
        pnpm exec vitest run --passWithNoTests --reporter=default --reporter=json --outputFile.json=vitest-report.json
        cp vitest-report.json vitest-report.main.json
        docker stop clamd
        NG239_CLAMD_STOPPED=1 pnpm exec vitest run tests/evidence-scan.live.test.ts -t 'NG-239 with the configured clamd stopped' --reporter=default --reporter=json --outputFile.json=vitest-report.stopped.json
        jq --slurpfile b vitest-report.stopped.json '
          ([$b[0].testResults[] | .name as $f | .assertionResults[]
            | select(.status == "passed" or .status == "failed")
            | {key: ($f + " :: " + .fullName), value: .status}] | from_entries) as $ran
          | .testResults |= map(.name as $f | .assertionResults |= map(
              if (.status != "passed" and .status != "failed") and ($ran[$f + " :: " + .fullName] != null)
              then .status = $ran[$f + " :: " + .fullName] else . end))
        ' vitest-report.main.json > vitest-report.json
        echo "taken from the clamd-stopped run:"
        jq -r --slurpfile m vitest-report.main.json '
          [$m[0].testResults[] | .name as $f | .assertionResults[] | {k: ($f + " :: " + .fullName), s: .status}] as $old
          | [.testResults[] | .name as $f | .assertionResults[] | {k: ($f + " :: " + .fullName), s: .status}] as $new
          | range(0; $new | length) | select($new[.].s != $old[.].s) | "  \($new[.].k): \($old[.].s) -> \($new[.].s)"
        ' vitest-report.json
        pnpm exec tsx scripts/check-live-skips.ts vitest-report.json
      env:
        AUTH_SECRET: 'ci-vitest-auth-secret-fixture-not-for-any-deployment'
        # Opt-in for keep-eu-sync.live.test.ts (TASK-MVIAOEGRE2JJT, FO-113 Y1).
        # CI's DATABASE_URL is the throwaway service container prepared above.
        KEEP_EU_LIVE: '1'
        # m17-stale-runs.live refuses a database named `fabrika` unless told it is a
        # throwaway one (FO-343). This job's `fabrika` is the service container above.
        ALLOW_SWEEP_ON_SHARED_DB: '1'
        # The clamd started above, read by tests/evidence-scan.live.test.ts.
        # NG239_*, not CLAMD_HOST: CLAMD_HOST is also the app's own setting
        # (src/lib/env.ts) and would change what the other suites see.
        NG239_CLAMD_HOST: '127.0.0.1'
        NG239_CLAMD_PORT: '3310'
        # FO-256: the pool's 1 s connect timeout fails on a loaded runner (same value as scripts/gate-isolated.sh).
        DB_CONNECT_TIMEOUT_MS: '10000'

  # NG-288 (3. tur): the e2e suite runs as shards, one `next dev` server per shard, so a
  # single server no longer carries all ~727 tests and its heap restart threshold is reached
  # less. Every shard has its own Postgres, mail catcher, MinIO and database: nothing is shared.
  # Needs build-and-test, so a red unit/lint job still stops the e2e run as before.
  # The shard count lives only in the matrix below; `e2e-gate` (further down) reads the
  # aggregate result, so the required check name stays `e2e-gate` whatever the count.
  e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # NG-289 (faz 3, düzeltme turu): four shards plus one job for the heavy spec. The suite
        # is split into 4 shards (E2E_SHARD_TOTAL below); `heavy` runs only
        # tests/e2e/guest-partner-direct-url.spec.ts on its own fresh dev server, and the four
        # shards leave that file out with --grep-invert. No test is dropped: the file runs
        # exactly once, in `heavy`. Why 4: next-server RSS grows through a shard (CI run
        # 44913458118, shard 2 of 3: 2046 MiB at 14:34 -> 6250 MiB at 14:45, every minute),
        # so the peak follows the number of tests one dev server serves. With 3 shards the
        # peak was 6250 MiB (shard 2, 245 tests); with 4 shards no shard has more than 200
        # (see docs/GATE.md "CI e2e" for the measured per-shard counts and RSS).
        shard: [1, 2, 3, 4, heavy]
    env:
      DATABASE_URL: postgresql://fabrika:fabrika@localhost:5432/fabrika
      DATABASE_URL_RLS_TEST: postgresql://fabrika_app:fabrika_app_ci@localhost:5432/fabrika
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: fabrika
          POSTGRES_USER: fabrika
          POSTGRES_PASSWORD: fabrika
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # Same mail catcher as build-and-test (see the comment there): the e2e invite specs need it.
      mailpit:
        image: axllent/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        ports:
          - 1025:1025
          - 8025:8025
    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Generate Prisma client
      run: pnpm db:generate

    # Each shard builds its own database from empty (see build-and-test, "Prepare database").
    # Once, not twice: the idempotency check already runs in build-and-test.
    - name: Prepare database
      run: |
        psql --version
        pnpm db:setup

    # Same reason: the browsers must match the pinned @playwright/test.
    - name: Install Playwright browsers
      run: pnpm exec playwright install --with-deps

    # Only for a manual `e2e_server: start` run: `next start` serves this build.
    # Its own step so the build time shows up on its own in the run summary.
    - name: Build for E2E (next build)
      if: ${{ inputs.e2e_server == 'start' }}
      run: pnpm build

    # S3-compatible store for the evidence specs, which upload through a real
    # presigned PUT (TASK-MUSJ4RYVZEZ6Q); without one, `next start` refuses
    # evidence uploads (production has no local stand-in). A `docker run` step,
    # not `services:`: the image has no default command and a service container
    # cannot be given `server /data`. MinIO's own images and dl.min.io are gone
    # (Docker Hub 404, quay.io unauthorized, dl.min.io 410 on 2026-10-03), so
    # this is Chainguard's build, pinned by digest (MinIO RELEASE.2026-09-22).
    # minioadmin/minioadmin is a throwaway credential like the Postgres one.
    - name: Start MinIO (test object store)
      run: |
        docker run -d --name minio -p 9000:9000 \
          -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
          cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034 \
          server /data
        for i in $(seq 1 30); do
          curl -sf http://localhost:9000/minio/health/live && { echo "MinIO up after ${i}s"; break; }
          sleep 1
        done
        curl -sf http://localhost:9000/minio/health/live || { docker logs minio; exit 1; }
        aws --endpoint-url http://localhost:9000 s3api head-bucket --bucket test-evidence 2>/dev/null \
          || aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket test-evidence
        aws --endpoint-url http://localhost:9000 s3api head-bucket --bucket test-evidence
        echo "bucket test-evidence ready"
        # Blog images (TASK-MUU20NSV2TETW): a second bucket anyone may read,
        # like the public bucket a deployment serves blog covers from. The
        # evidence bucket above stays private.
        aws --endpoint-url http://localhost:9000 s3api head-bucket --bucket test-public 2>/dev/null \
          || aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket test-public
        aws --endpoint-url http://localhost:9000 s3api put-bucket-policy --bucket test-public --policy \
          '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::test-public/*"]}]}'
        echo "bucket test-public ready (anonymous read)"
      env:
        AWS_ACCESS_KEY_ID: minioadmin
        AWS_SECRET_ACCESS_KEY: minioadmin
        AWS_REGION: us-east-1
        AWS_EC2_METADATA_DISABLED: 'true'

    # R2_* only here, not job-wide: the vitest suites import storage.ts and
    # some (evidence-dev-store.live) need the local stand-in; the S3 live suites
    # read EVIDENCE_S3_TEST_* instead. R2_ACCOUNT_ID only switches the client on;
    # R2_ENDPOINT sends it to MinIO.
    # NG-288: `next dev` restarts itself once its V8 heap passes 80% of the heap limit
    # ("Server is approaching the used memory threshold, restarting...", next
    # dist/server/lib/utils.js getMemoryRestartStats; experimental.devMemoryThresholdRestart).
    # The limit is V8's default on the runner (~4 GiB), so 700+ tests in one dev server
    # reached it (run 44821853657). Raise the limit for CI only: NODE_OPTIONS reaches the
    # web server through playwright.config.ts (WEB_SERVER_NODE_OPTIONS). Local gate unchanged.
    # The sampler below prints the web server's RSS every 60 s into this job log ([e2e-mem]),
    # so a growing heap can be told apart from a steady one. It is a measurement, not a fix.
    - name: E2E Test (${{ matrix.shard }})
      run: |
        echo "[e2e-mem] runner: $(nproc) cpu, $(free -m | awk '/Mem:/ {print $2}') MiB RAM; node default heap limit: $(env -u NODE_OPTIONS node -p 'require("v8").getHeapStatistics().heap_size_limit / 1048576') MiB; NODE_OPTIONS=$NODE_OPTIONS"
        ( while sleep 60; do
            ps -eo pid=,rss=,args= | awk -v ts="$(date -u +%H:%M:%S)" '/next dev|next start|next\/dist|next-server/ && !/awk/ {printf "[e2e-mem] %s pid=%s rss=%.0fMiB %.100s\n", ts, $1, $2/1024, substr($0, index($0, $3)); s += $2; n++} END {printf "[e2e-mem] %s total procs=%d rss=%.0fMiB\n", ts, n, s/1024}'
          done ) &
        sampler=$!
        # NG-289 (Ö3): killing the subshell alone left its `sleep 60` child running
        # (orphan). Kill that child first; with it gone the loop ends by itself.
        trap 'pkill -P "$sampler" 2>/dev/null || true; kill "$sampler" 2>/dev/null || true; wait "$sampler" 2>/dev/null || true' EXIT
        status=0
        if [ "$E2E_PART" = heavy ]; then
          pnpm test:e2e "$E2E_HEAVY_SPEC" || status=$?
        else
          pnpm test:e2e --shard="$E2E_PART/$E2E_SHARD_TOTAL" --grep-invert "$E2E_HEAVY_SPEC" || status=$?
        fi
        # NG-289 (Ö3) evidence: stop the sampler here, before the step ends, and print how many
        # `sleep 60` children are still alive. 0 = no orphan. The trap above is the backstop.
        pkill -P "$sampler" 2>/dev/null || true; kill "$sampler" 2>/dev/null || true; wait "$sampler" 2>/dev/null || true
        echo "[e2e-mem] sampler stopped; orphan 'sleep 60' left: $(pgrep -fxc 'sleep 60' || true)"
        exit "$status"
      env:
        CI: 'true'
        E2E_PART: ${{ matrix.shard }}
        E2E_SHARD_TOTAL: '4'
        # Matched as a regex against the test file path (positional filter) and against
        # "project file describe title" (--grep-invert); the name occurs in no other file.
        E2E_HEAVY_SPEC: 'guest-partner-direct-url\.spec\.ts'
        E2E_WEB_SERVER: ${{ inputs.e2e_server || 'dev' }}
        NODE_OPTIONS: '--max-old-space-size=6144'
        # FO-256: the pool's 1 s connect timeout fails on a loaded runner (same value as scripts/gate-isolated.sh).
        DB_CONNECT_TIMEOUT_MS: '10000'
        R2_ACCOUNT_ID: 'ci-minio'
        R2_ENDPOINT: 'http://localhost:9000'
        R2_ACCESS_KEY_ID: 'minioadmin'
        R2_SECRET_ACCESS_KEY: 'minioadmin'
        R2_BUCKET: 'test-evidence'
        R2_PUBLIC_BUCKET: 'test-public'
        R2_PUBLIC_HOST: 'http://localhost:9000/test-public'
        # OAuth placeholder env for E2E auth tests (tests render button only, no real Google interaction)
        AUTH_GOOGLE_ID: 'ci-placeholder-id.apps.googleusercontent.com'
        AUTH_GOOGLE_SECRET: 'ci-placeholder-google-secret'
        AUTH_SECRET: 'ci-placeholder-secret-for-nextauth-at-least-32-chars-1234'
        AUTH_URL: 'http://localhost:3000'
        NEXTAUTH_URL: 'http://localhost:3000'
        AUTH_TRUST_HOST: 'true'
        # The mailpit service above; E2E_MAILPIT_URL turns on the inbox check.
        # An invitation mail needs a base URL for its link and is not sent
        # without one. The dev server falls back to this same origin anyway,
        # so it changes nothing else (a `start` run refuses loopback here).
        SMTP_HOST: 'localhost'
        SMTP_PORT: '1025'
        E2E_MAILPIT_URL: 'http://localhost:8025'
        NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
        # Invoice test data
        INVOICE_SUPPLIER_NAME: 'TEST E2E Tedarikçi A.Ş.'
        INVOICE_SUPPLIER_VKN: '1000000000'
        INVOICE_SUPPLIER_TAX_OFFICE: 'TEST VD'
        INVOICE_SUPPLIER_ADDRESS: 'TEST CAD NO:1'
        INVOICE_SUPPLIER_CITY: 'Ankara'

    # trace: 'retain-on-failure' (playwright.config.ts) writes a trace.zip per failed
    # test into test-results/, and the HTML report into playwright-report/; without this
    # step they died with the runner and a CI timeout could not be looked into
    # (TASK-MULXYMNTUELIK). `gh run download <run-id> -n e2e-results-<run-id>-<attempt>`.
    - name: Upload E2E traces and report
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: e2e-results-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
        path: |
          test-results/
          playwright-report/
        if-no-files-found: ignore
        retention-days: 14

  # NG-288 (3. tur): one fixed check name for the whole e2e suite. The matrix shard
  # jobs are named `e2e (1)`, `e2e (2)`, … and change with the shard count, which
  # makes them a poor branch-protection context. This job always exists under the
  # same name. `if: always()` makes it run even when e2e is skipped or cancelled,
  # and then `needs.e2e.result` is not `success`, so the check goes red.
  e2e-gate:
    needs: [e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Every e2e shard must succeed
      env:
        E2E_RESULT: ${{ needs.e2e.result }}
      run: |
        echo "e2e (all shards) result: $E2E_RESULT"
        if [ "$E2E_RESULT" != "success" ]; then
          echo "e2e did not pass on every shard; failing e2e-gate"
          exit 1
        fi

  # CORDIS worker (Python). Its own job: it needs no Postgres or Node, and a
  # failure here should not hide the app's result. The interpreter comes from
  # workers/cordis/.python-version so CI cannot drift from the README.
  cordis-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/cordis
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version-file: workers/cordis/.python-version

    # Hash-checked install from the lock: only the pinned, 3.12-resolved set.
    - name: Install locked dependencies
      run: pip install --require-hashes -r requirements.lock

    # Same file the README uses; its `-r requirements.txt` is already met by the lock.
    - name: Install test-only pins
      run: pip install -r requirements-dev.txt

    - name: Test
      run: python -m pytest -q

    # pip-audit runs on the locked set with the same interpreter that installed
    # it. It is installed here, not added to the repo's requirements.
    - name: Audit locked dependencies
      run: |
        pip install pip-audit==2.10.1
        pip-audit -r requirements.lock
